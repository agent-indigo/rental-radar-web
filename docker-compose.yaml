services:
  database:
    image: postgres:latest
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: RentalRadar
  rental-radar-web:
    image: rental-radar-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - database